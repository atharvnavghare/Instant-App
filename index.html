<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INSTANT — Men's Fashion, Instantly.</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#171410" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  body { margin: 0; }
  .ticker-track { animation: scroll-left 14s linear infinite; }
  @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

  .app-bg { padding: 24px 0; min-height: 100vh; min-height: 100dvh; }
  .phone-frame { width: 380px; height: 780px; }
  @media (max-width: 640px) {
    .app-bg { padding: 0 !important; }
    .phone-frame {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const INK = "#171410";
const PAPER = "#EDE9DD";
const ORANGE = "#F5B301";
const GREEN = "#1C8A4B";
const NAVY = "#24306B";
const LINE = "#C9C2AE";

const CATEGORIES = [
  { id: "all", label: "All", emoji: "✨" },
  { id: "tshirts", label: "T-Shirts", emoji: "👕" },
  { id: "jeans", label: "Jeans/Pants", emoji: "👖" },
  { id: "shirts", label: "Shirts", emoji: "🧥" },
  { id: "shorts", label: "Shorts/Cargos", emoji: "🩳" },
  { id: "footwear", label: "Footwear", emoji: "👟" },
  { id: "accessories", label: "Accessories", emoji: "🧢" },
];

const GRADIENTS = {
  tshirts: "linear-gradient(135deg,#3a3a3a,#171410)",
  jeans: "linear-gradient(135deg,#2b3a63,#171410)",
  shirts: "linear-gradient(135deg,#5c4a2e,#171410)",
  shorts: "linear-gradient(135deg,#4a5c3a,#171410)",
  footwear: "linear-gradient(135deg,#6b2e2e,#171410)",
  accessories: "linear-gradient(135deg,#5c3a5c,#171410)",
};

// PRODUCTS is now loaded at runtime from products.json (see useEffect in InstantApp)

function PriceTag({ value, mrp, size }) {
  const big = size === "lg";
  const off = mrp && mrp > value ? Math.round(((mrp - value) / mrp) * 100) : 0;
  return (
    <div className="inline-flex items-center gap-1.5 flex-wrap">
      <div className="inline-flex items-center gap-1 shrink-0" style={{
        background: ORANGE, color: INK, padding: big ? "5px 12px" : "3px 9px",
        transform: "rotate(-2deg)", fontFamily: "'Space Mono', monospace", fontWeight: 800,
        fontSize: big ? 18 : 14, border: `1.5px dashed ${INK}`, boxShadow: "2px 2px 0 rgba(23,20,16,0.25)",
      }}>₹{value}</div>
      {off > 0 && (
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: big ? 13 : 11, color: "#8a8578", textDecoration: "line-through", fontWeight: 700 }}>₹{mrp}</span>
      )}
      {off > 0 && (
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: big ? 12 : 10, color: GREEN, fontWeight: 800 }}>{off}% OFF</span>
      )}
    </div>
  );
}

function ImageGallery({ images, cat, name }) {
  const [idx, setIdx] = useState(0);
  const pics = images && images.length > 0 ? images : [];
  const touchStartX = React.useRef(null);

  function go(delta) {
    setIdx((i) => (i + delta + pics.length) % pics.length);
  }
  function onTouchStart(e) { touchStartX.current = e.touches[0].clientX; }
  function onTouchEnd(e) {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (dx > 40) go(-1);
    else if (dx < -40) go(1);
    touchStartX.current = null;
  }

  if (pics.length === 0) {
    return (
      <div className="w-full flex items-center justify-center" style={{ height: 260, background: GRADIENTS[cat] }}>
        <span style={{ fontSize: 70, opacity: 0.9 }}>{CATEGORIES.find((c) => c.id === cat)?.emoji}</span>
      </div>
    );
  }

  return (
    <div className="relative w-full" style={{ height: 260, background: GRADIENTS[cat] }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <img src={pics[idx]} alt={name} className="w-full h-full object-cover" />
      {pics.length > 1 && (
        <>
          <button onClick={() => go(-1)} className="absolute left-1.5 top-1/2 flex items-center justify-center" style={{
            transform: "translateY(-50%)", width: 30, height: 30, borderRadius: "50%", background: "rgba(23,20,16,0.55)", color: PAPER, fontSize: 16,
          }}>‹</button>
          <button onClick={() => go(1)} className="absolute right-1.5 top-1/2 flex items-center justify-center" style={{
            transform: "translateY(-50%)", width: 30, height: 30, borderRadius: "50%", background: "rgba(23,20,16,0.55)", color: PAPER, fontSize: 16,
          }}>›</button>
          <div className="absolute bottom-2 left-0 right-0 flex items-center justify-center gap-1.5">
            {pics.map((_, i) => (
              <span key={i} style={{
                width: 6, height: 6, borderRadius: "50%", background: i === idx ? INK : "rgba(23,20,16,0.35)",
              }} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function ProductDetailModal({ p, onClose, onAdd, rating, extraSold }) {
  const hasRating = rating && rating.count > 0;
  const soldToday = p.sold + (extraSold || 0);
  const hasSizes = p.sizes && p.sizes.length > 0;
  const [selectedSize, setSelectedSize] = useState(null);
  const [sizeError, setSizeError] = useState(false);
  const off = p.mrp && p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;

  function handleAdd() {
    if (p.outOfStock) return;
    if (hasSizes && !selectedSize) {
      setSizeError(true);
      setTimeout(() => setSizeError(false), 1200);
      return;
    }
    onAdd(p, selectedSize);
    onClose();
  }

  return (
    <div className="absolute inset-0 z-20 flex flex-col" style={{ background: PAPER }}>
      <div className="flex items-center justify-between px-4 py-3 shrink-0" style={{ borderBottom: `1.5px solid ${INK}` }}>
        <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: INK }}>PRODUCT DETAILS</span>
        <button onClick={onClose} style={{ fontSize: 18, color: INK }}>✕</button>
      </div>
      <div className="flex-1 overflow-y-auto">
        <ImageGallery images={p.images} cat={p.cat} name={p.name} />
        <div className="px-4 py-4 flex flex-col gap-3">
          <div>
            <span style={{
              fontFamily: "'Space Mono', monospace", fontSize: 10, fontWeight: 700, color: NAVY,
              border: `1px solid ${NAVY}`, padding: "2px 6px",
            }}>{CATEGORIES.find((c) => c.id === p.cat)?.label || p.cat}</span>
          </div>
          <h2 style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 20, color: INK, lineHeight: 1.2 }}>{p.name}</h2>

          <div className="flex items-center gap-2 flex-wrap">
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 26, fontWeight: 800, color: INK }}>₹{p.price}</span>
            {off > 0 && (
              <>
                <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 15, color: "#8a8578", textDecoration: "line-through", fontWeight: 700 }}>₹{p.mrp}</span>
                <span style={{
                  fontFamily: "'Space Mono', monospace", fontSize: 12, color: PAPER, fontWeight: 800,
                  background: GREEN, padding: "2px 7px",
                }}>{off}% OFF</span>
              </>
            )}
          </div>
          <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.65 }}>Inclusive of all taxes. + ₹{DELIVERY_FEE} delivery fee at checkout.</span>

          <div className="flex items-center gap-3 py-1" style={{ borderTop: `1px dashed ${LINE}`, borderBottom: `1px dashed ${LINE}` }}>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: GREEN, fontWeight: 700, padding: "6px 0" }}>● {soldToday} sold today</span>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: hasRating ? INK : "#999", fontWeight: 700 }}>
              {hasRating ? `⭐ ${rating.avg.toFixed(1)} (${rating.count} ratings)` : "☆ No ratings yet"}
            </span>
          </div>

          {hasSizes && (
            <div className="flex flex-col gap-1.5">
              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: sizeError ? "#c0392b" : INK, fontWeight: 700 }}>
                {sizeError ? "Select a size first" : "SELECT SIZE (UK)"}
              </span>
              <div className="flex flex-wrap gap-2">
                {p.sizes.map((s) => (
                  <button key={s} onClick={() => setSelectedSize(s)} style={{
                    width: 42, height: 42, fontFamily: "'Space Mono', monospace", fontSize: 14, fontWeight: 700,
                    border: `1.5px solid ${selectedSize === s ? INK : LINE}`,
                    background: selectedSize === s ? INK : "transparent",
                    color: selectedSize === s ? PAPER : INK,
                  }}>{s}</button>
                ))}
              </div>
            </div>
          )}

          <div className="flex flex-col gap-1.5 pt-2">
            <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 13, color: INK }}>Why shop with INSTANT?</span>
            <ul className="flex flex-col gap-1">
              {["Cash on Delivery available", "Fast local delivery in Hinganghat", "Order directly via WhatsApp"].map((t, i) => (
                <li key={i} style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12.5, color: INK, opacity: 0.85 }}>• {t}</li>
              ))}
            </ul>
          </div>
        </div>
      </div>
      <div className="shrink-0 px-4 py-3" style={{ borderTop: `1.5px solid ${INK}`, background: PAPER }}>
        <button onClick={handleAdd} disabled={p.outOfStock} className="w-full flex items-center justify-center gap-1 transition-transform active:scale-95" style={{
          background: p.outOfStock ? LINE : INK, color: p.outOfStock ? "#8a8578" : PAPER, fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700, padding: "12px 0",
        }}>{p.outOfStock ? "OUT OF STOCK" : `+ ADD TO BAG — ₹${p.price}`}</button>
      </div>
    </div>
  );
}

function ProductCard({ p, onAdd, added, rating, extraSold, onOpenDetail }) {
  const hasRating = rating && rating.count > 0;
  const soldToday = p.sold + (extraSold || 0);
  const hasSizes = p.sizes && p.sizes.length > 0;
  const [selectedSize, setSelectedSize] = useState(hasSizes ? null : undefined);
  const [sizeError, setSizeError] = useState(false);

  function handleAdd() {
    if (p.outOfStock) return;
    if (hasSizes && !selectedSize) {
      setSizeError(true);
      setTimeout(() => setSizeError(false), 1200);
      return;
    }
    onAdd(p, selectedSize);
  }

  return (
    <div className="flex flex-col shrink-0" style={{ width: 152, background: "#fff", border: `1px solid ${LINE}` }}>
      <div className="relative flex items-center justify-center overflow-hidden cursor-pointer" style={{ height: 130, background: GRADIENTS[p.cat] }} onClick={() => onOpenDetail(p)}>
        {p.img ? (
          <img src={p.img} alt={p.name} className="w-full h-full object-cover" />
        ) : (
          <span style={{ fontSize: 40, opacity: 0.9 }}>{CATEGORIES.find((c) => c.id === p.cat)?.emoji}</span>
        )}
        {p.trending && (
          <div className="absolute top-1.5 left-1.5 flex items-center gap-0.5" style={{
            background: INK, color: ORANGE, fontFamily: "'Space Mono', monospace", fontSize: 10, fontWeight: 700, padding: "2px 5px",
          }}>🔥 HOT</div>
        )}
        {p.outOfStock && (
          <div className="absolute inset-0 flex items-center justify-center" style={{ background: "rgba(23,20,16,0.55)" }}>
            <span style={{
              background: PAPER, color: INK, fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 800, padding: "4px 10px",
              transform: "rotate(-4deg)", border: `1.5px solid ${INK}`,
            }}>OUT OF STOCK</span>
          </div>
        )}
        <div className="absolute -bottom-2 left-2"><PriceTag value={p.price} /></div>
      </div>
      <div className="px-2 pt-3 pb-2 flex flex-col gap-1.5" style={{ color: INK }}>
        <p className="leading-tight cursor-pointer" style={{ fontFamily: "'Work Sans', sans-serif", fontWeight: 600, fontSize: 12.5, minHeight: 32 }} onClick={() => onOpenDetail(p)}>{p.name}</p>
        {p.mrp && p.mrp > p.price && (
          <div className="flex items-center gap-1.5">
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10.5, color: "#8a8578", textDecoration: "line-through", fontWeight: 700 }}>₹{p.mrp}</span>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, fontWeight: 800 }}>{Math.round(((p.mrp - p.price) / p.mrp) * 100)}% OFF</span>
          </div>
        )}
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, fontWeight: 700 }}>● {soldToday} sold today</span>
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10.5, color: hasRating ? INK : "#999", fontWeight: 700 }}>
          {hasRating ? `⭐ ${rating.avg.toFixed(1)} (${rating.count})` : "☆ No ratings yet"}
        </span>
        {hasSizes && (
          <div className="flex flex-col gap-1">
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 9.5, color: sizeError ? "#c0392b" : INK, opacity: sizeError ? 1 : 0.65, fontWeight: 700 }}>
              {sizeError ? "Select a size first" : "SIZE"}
            </span>
            <div className="flex flex-wrap gap-1">
              {p.sizes.map((s) => (
                <button key={s} onClick={() => setSelectedSize(s)} style={{
                  width: 24, height: 24, fontFamily: "'Space Mono', monospace", fontSize: 10.5, fontWeight: 700,
                  border: `1.5px solid ${selectedSize === s ? INK : LINE}`,
                  background: selectedSize === s ? INK : "transparent",
                  color: selectedSize === s ? PAPER : INK,
                }}>{s}</button>
              ))}
            </div>
          </div>
        )}
        <button onClick={handleAdd} disabled={p.outOfStock} className="mt-1 w-full flex items-center justify-center gap-1 transition-transform active:scale-95" style={{
          background: p.outOfStock ? LINE : (added ? GREEN : INK), color: p.outOfStock ? "#8a8578" : PAPER, fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, padding: "7px 0",
        }}>{p.outOfStock ? "OUT OF STOCK" : (added ? "✓ ADDED" : "+ ADD")}</button>
      </div>
    </div>
  );
}

const WHATSAPP_NUMBER = "919834976390";
function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v && typeof v === "object" ? v : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

const COUNTER_NAMESPACE = "instant-hinganghat-app";
const DELIVERY_FEE = 40;

function InstantApp() {
  const [category, setCategory] = useState("all");
  const [PRODUCTS, setPRODUCTS] = useState([]);
  const [productsLoading, setProductsLoading] = useState(true);

  useEffect(() => {
    fetch("./products.json", { cache: "no-store" })
      .then((r) => r.json())
      .then((data) => setPRODUCTS(Array.isArray(data) ? data : []))
      .catch(() => setPRODUCTS([]))
      .finally(() => setProductsLoading(false));
  }, []);

  const [cart, setCart] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("instant_cart") || "[]");
      return Array.isArray(saved) ? saved : [];
    } catch (e) { return []; }
  });
  const [cartOpen, setCartOpen] = useState(false);
  const [justAdded, setJustAdded] = useState(null);
  const [tab, setTab] = useState("home");
  const [custName, setCustName] = useState("");
  const [custPhone, setCustPhone] = useState("");
  const [custAddress, setCustAddress] = useState("");
  const [formError, setFormError] = useState("");

  const [loggedIn, setLoggedIn] = useState(false);
  const [authChecked, setAuthChecked] = useState(false);
  const [loginStep, setLoginStep] = useState("details");
  const [loginName, setLoginName] = useState("");
  const [loginPhone, setLoginPhone] = useState("");
  const [loginError, setLoginError] = useState("");
  const [captchaCode, setCaptchaCode] = useState("");
  const [captchaInput, setCaptchaInput] = useState("");

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("instant_user") || "null");
      if (saved && saved.name && saved.phone) {
        setLoggedIn(true);
        setCustName(saved.name);
        setCustPhone(saved.phone);
      }
    } catch (e) {}
    setAuthChecked(true);
  }, []);

  function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
    setCaptchaCode(code);
  }

  function goToCaptcha() {
    if (!loginName.trim() || loginPhone.trim().length < 10) {
      setLoginError("Poora naam aur 10-digit phone number daalo.");
      return;
    }
    setLoginError("");
    setCaptchaInput("");
    generateCaptcha();
    setLoginStep("captcha");
  }

  function verifyCaptcha() {
    if (captchaInput.trim().toUpperCase() !== captchaCode) {
      setLoginError("Captcha match nahi hua, dubara try karo.");
      generateCaptcha();
      setCaptchaInput("");
      return;
    }
    const user = { name: loginName.trim(), phone: loginPhone.trim() };
    try { localStorage.setItem("instant_user", JSON.stringify(user)); } catch (e) {}
    setCustName(user.name);
    setCustPhone(user.phone);
    setLoggedIn(true);
  }

  const [orderCount, setOrderCount] = useState(0);
  const [orderPlaced, setOrderPlaced] = useState(false);  const [orderId, setOrderId] = useState(null);
  const [orderItems, setOrderItems] = useState([]);
  const [orderMsg, setOrderMsg] = useState("");
  const [itemRatings, setItemRatings] = useState({});
  const [ratingsMap, setRatingsMap] = useState({});
  const [soldMap, setSoldMap] = useState({});
  const [ratingsSubmitted, setRatingsSubmitted] = useState(false);
  const [feedbackText, setFeedbackText] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [myOrders, setMyOrders] = useState([]);
  const [detailProduct, setDetailProduct] = useState(null);

  useEffect(() => {
    try { localStorage.setItem("instant_cart", JSON.stringify(cart)); } catch (e) {}
  }, [cart]);

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("instant_orders") || "[]");
      setMyOrders(saved);
    } catch (e) {}
  }, []);

  function logout() {
    try { localStorage.removeItem("instant_user"); } catch (e) {}
    setLoggedIn(false);
    setLoginStep("details");
    setLoginName(""); setLoginPhone(""); setCaptchaInput(""); setCaptchaCode("");
    setCustName(""); setCustPhone("");
    setTab("home");
  }

  const searchResults = useMemo(() => {
    const q = searchQuery.trim().toLowerCase().replace(/^#/, "");
    if (!q) return [];
    return PRODUCTS.filter((p) => {
      const catLabel = (CATEGORIES.find((c) => c.id === p.cat)?.label || "").toLowerCase();
      return p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q) || catLabel.includes(q);
    });
  }, [searchQuery, PRODUCTS]);

  useEffect(() => {
    setOrderCount(loadJSON("instant_order_count", { n: 0 }).n || 0);
    setSoldMap(loadJSON("instant_sold_map", {}));

    const savedRatings = loadJSON("instant_ratings_map", {});
    const map = {};
    Object.keys(savedRatings).forEach((id) => {
      const { sum, count } = savedRatings[id];
      map[id] = { sum, count, avg: count > 0 ? sum / count : 0 };
    });
    setRatingsMap(map);
  }, []);

  const filtered = useMemo(() => (category === "all" ? PRODUCTS : PRODUCTS.filter((p) => p.cat === category)), [category, PRODUCTS]);
  const trending = PRODUCTS.filter((p) => p.trending);
  const under499 = PRODUCTS.filter((p) => p.price < 499);

  function addToCart(p, size) {
    setCart((c) => {
      const idx = c.findIndex((item) => item.id === p.id && item.selectedSize === size);
      if (idx > -1) {
        const next = [...c];
        next[idx] = { ...next[idx], qty: next[idx].qty + 1 };
        return next;
      }
      return [...c, { ...p, selectedSize: size, qty: 1 }];
    });
    setJustAdded(p.id);
    setTimeout(() => setJustAdded(null), 900);
  }

  function changeQty(index, delta) {
    setCart((c) => {
      const next = [...c];
      const newQty = next[index].qty + delta;
      if (newQty <= 0) return next.filter((_, i) => i !== index);
      next[index] = { ...next[index], qty: newQty };
      return next;
    });
  }

  function removeFromCart(index) {
    setCart((c) => c.filter((_, i) => i !== index));
  }

  const total = cart.reduce((s, p) => s + p.price * p.qty, 0);
  const grandTotal = cart.length > 0 ? total + DELIVERY_FEE : 0;

  function confirmOrder() {
    if (!custName.trim() || !custPhone.trim() || !custAddress.trim()) {
      setFormError("Naam, phone number aur address bharna zaroori hai.");
      return;
    }
    setFormError("");
    const lines = cart.map((p) => `- ${p.name}${p.selectedSize ? " (Size: " + p.selectedSize + ")" : ""} x${p.qty} (₹${p.price} each = ₹${p.price * p.qty})`).join("%0A");
    const msg = `Hi INSTANT! New order from Hinganghat%0A%0A${lines}%0A%0AItems Total: ₹${total}%0ADelivery Fee: ₹${DELIVERY_FEE}%0AGrand Total: ₹${grandTotal}%0APayment: Cash on Delivery%0A%0AName: ${custName}%0APhone: ${custPhone}%0AAddress: ${custAddress}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");

    const newOrderCount = orderCount + 1;
    setOrderCount(newOrderCount);
    saveJSON("instant_order_count", { n: newOrderCount });
    setOrderId(newOrderCount);

    setSoldMap((prev) => {
      const next = { ...prev };
      cart.forEach((p) => { next[p.id] = (next[p.id] || 0) + p.qty; });
      saveJSON("instant_sold_map", next);
      return next;
    });

    saveOrderToHistory(newOrderCount, cart, grandTotal, msg);

    setOrderItems(cart);
    setOrderMsg(msg);
    setOrderPlaced(true);
    setCart([]);
  }

  function saveOrderToHistory(id, items, orderTotal, msg) {
    const record = {
      id, items: items.map((p) => ({ name: p.name, price: p.price, size: p.selectedSize, qty: p.qty })),
      total: orderTotal, date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }),
      address: custAddress, msg,
    };
    setMyOrders((prev) => {
      const next = [record, ...prev];
      try { localStorage.setItem("instant_orders", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }

  function rateProduct(id, stars) {
    setItemRatings((r) => ({ ...r, [id]: stars }));
  }

  function submitRatings() {
    const rated = Object.entries(itemRatings).filter(([, v]) => v > 0);
    if (rated.length === 0) return;

    setRatingsMap((prev) => {
      const next = { ...prev };
      rated.forEach(([id, stars]) => {
        const existing = next[id] || { sum: 0, count: 0 };
        const sum = existing.sum + stars;
        const count = existing.count + 1;
        next[id] = { sum, count, avg: sum / count };
      });
      const toStore = {};
      Object.keys(next).forEach((id) => { toStore[id] = { sum: next[id].sum, count: next[id].count }; });
      saveJSON("instant_ratings_map", toStore);
      return next;
    });

    const lines = rated.map(([id, stars]) => {
      const prod = PRODUCTS.find((p) => String(p.id) === String(id));
      return `${prod ? prod.name : "Item"}: ${"⭐".repeat(stars)} (${stars}/5)`;
    }).join("%0A");
    const msg = `Product ratings for order ${orderId ? "#IN-" + orderId : ""} (${custName}):%0A${lines}${feedbackText ? "%0A%0AComment: " + feedbackText : ""}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
    setRatingsSubmitted(true);
  }

              ) : (
                <>
                  <div className="flex-1 overflow-y-auto px-4 py-2">
                    {cart.length === 0 ? (
                      <p className="py-8 text-center" style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.6 }}>Bag is empty. Add something trending.</p>
                    ) : (
                      cart.map((p, i) => (
                        <div key={i} className="flex items-center justify-between py-2 gap-2" style={{ borderBottom: `1px dashed ${LINE}` }}>
                          <div className="flex flex-col gap-1">
                            <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, fontWeight: 600 }}>{p.name}{p.selectedSize ? ` (Size ${p.selectedSize})` : ""}</span>
                            <div className="flex items-center gap-2">
                              <button onClick={() => changeQty(i, -1)} style={{
                                width: 20, height: 20, fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700,
                                color: INK, border: `1px solid ${LINE}`, background: "transparent", lineHeight: 1,
                              }}>−</button>
                              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, fontWeight: 700, minWidth: 14, textAlign: "center" }}>{p.qty}</span>
                              <button onClick={() => changeQty(i, 1)} style={{
                                width: 20, height: 20, fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700,
                                color: INK, border: `1px solid ${LINE}`, background: "transparent", lineHeight: 1,
                              }}>+</button>
                            </div>
                          </div>
                          <div className="flex items-center gap-2 shrink-0">
                            <PriceTag value={p.price * p.qty} />
                            <button onClick={() => removeFromCart(i)} aria-label="Remove item" style={{
                              width: 22, height: 22, fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700,
                              color: "#c0392b", border: `1px solid #c0392b`, background: "transparent", lineHeight: 1,
                            }}>✕</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                  {cart.length > 0 && (
                    <div className="px-4 py-3 overflow-y-auto" style={{ borderTop: `1px solid ${LINE}` }}>
                      <div className="flex items-center justify-between">
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.7 }}>Items Total</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK }}>₹{total}</span>
                      </div>
                      <div className="flex items-center justify-between mt-1 pb-2" style={{ borderBottom: `1px dashed ${LINE}` }}>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.7 }}>Delivery Fee</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK }}>₹{DELIVERY_FEE}</span>
                      </div>
                      <div className="flex items-center justify-between mb-2 mt-1.5">
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, fontWeight: 700, color: INK }}>TOTAL</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 16, fontWeight: 700, color: ORANGE }}>₹{grandTotal}</span>
                      </div>

                      <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.6, fontWeight: 700 }}>DELIVERY DETAILS</span>
                      <input
                        value={custName}
                        onChange={(e) => setCustName(e.target.value)}
                        placeholder="Full Name"
                        className="w-full mt-1.5 px-2 py-2"
                        style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK }}
                      />
                      <input
                        value={custPhone}
                        onChange={(e) => setCustPhone(e.target.value)}
                        placeholder="Contact Number"
                        type="tel"
                        className="w-full mt-2 px-2 py-2"
                        style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK }}
                      />
                      <textarea
                        value={custAddress}
                        onChange={(e) => setCustAddress(e.target.value)}
                        placeholder="Full Delivery Address (Hinganghat)"
                        rows="2"
                        className="w-full mt-2 px-2 py-2"
                        style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK, resize: "none" }}
                      />
                      {formError && (
                        <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 10.5, color: ORANGE, marginTop: 6 }}>{formError}</p>
                      )}

                      <div className="flex items-center gap-1.5 mt-3 mb-3 px-2 py-2" style={{ background: "#fff", border: `1px dashed ${LINE}` }}>
                        <span style={{ fontSize: 15 }}>💵</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, fontWeight: 700 }}>Payment: Cash on Delivery</span>
                      </div>

                      <button onClick={confirmOrder} className="w-full py-3" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
                        CONFIRM ORDER VIA WHATSAPP
                      </button>
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<InstantApp />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
