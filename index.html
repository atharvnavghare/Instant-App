<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INSTANT — Men's Fashion, Instantly.</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#171410" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  body { margin: 0; }
  .ticker-track { animation: scroll-left 14s linear infinite; }
  @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

  .app-bg { padding: 24px 0; min-height: 100vh; min-height: 100dvh; }
  .phone-frame { width: 380px; height: 780px; }
  @media (max-width: 640px) {
    .app-bg { padding: 0 !important; }
    .phone-frame {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const INK = "#171410";
const PAPER = "#EDE9DD";
const ORANGE = "#F5B301";
const GREEN = "#1C8A4B";
const NAVY = "#24306B";
const LINE = "#C9C2AE";

const CATEGORIES = [
  { id: "all", label: "All", emoji: "✨" },
  { id: "tshirts", label: "T-Shirts", emoji: "👕" },
  { id: "jeans", label: "Jeans/Pants", emoji: "👖" },
  { id: "shirts", label: "Shirts", emoji: "🧥" },
  { id: "shorts", label: "Shorts/Cargos", emoji: "🩳" },
  { id: "footwear", label: "Footwear", emoji: "👟" },
  { id: "accessories", label: "Accessories", emoji: "🧢" },
];

const GRADIENTS = {
  tshirts: "linear-gradient(135deg,#3a3a3a,#171410)",
  jeans: "linear-gradient(135deg,#2b3a63,#171410)",
  shirts: "linear-gradient(135deg,#5c4a2e,#171410)",
  shorts: "linear-gradient(135deg,#4a5c3a,#171410)",
  footwear: "linear-gradient(135deg,#6b2e2e,#171410)",
  accessories: "linear-gradient(135deg,#5c3a5c,#171410)",
};

const PRODUCTS = [
  { id: 1, name: "Oversized Black Tee", cat: "tshirts", price: 399, sold: 42, trending: true },
  { id: 2, name: "Baggy Cargo", cat: "shorts", price: 699, sold: 31, trending: true },
  { id: 3, name: "Relaxed Fit Shirt", cat: "shirts", price: 499, sold: 27, trending: true },
  { id: 4, name: "Washed Denim Jeans", cat: "jeans", price: 899, sold: 19 },
  { id: 5, name: "Graphic Print Tee", cat: "tshirts", price: 349, sold: 55, trending: true },
  { id: 6, name: "Cargo Shorts", cat: "shorts", price: 449, sold: 22 },
  { id: 7, name: "Chunky Sneakers", cat: "footwear", price: 1299, sold: 14 },
  { id: 8, name: "Canvas Trainers", cat: "footwear", price: 799, sold: 18 },
  { id: 9, name: "Corduroy Cap", cat: "accessories", price: 299, sold: 38 },
  { id: 10, name: "Chain Bracelet", cat: "accessories", price: 199, sold: 46 },
  { id: 11, name: "Slim Fit Chinos", cat: "jeans", price: 649, sold: 12 },
  { id: 12, name: "Polo Tee", cat: "tshirts", price: 449, sold: 20 },
  { id: 13, name: "Asian Sneakers", cat: "footwear", price: 549, sold: 9, img: "product-13.jpg", sizes: [7, 8, 9] },
  { id: 14, name: "Asian Sneakers - Grey", cat: "footwear", price: 549, sold: 6, img: "product-14.jpg", sizes: [7, 8, 9] },
];

function PriceTag({ value, size }) {
  const big = size === "lg";
  return (
    <div className="inline-flex items-center gap-1 shrink-0" style={{
      background: ORANGE, color: PAPER, padding: big ? "4px 10px" : "2px 8px",
      transform: "rotate(-2deg)", fontFamily: "'Space Mono', monospace", fontWeight: 700,
      fontSize: big ? 15 : 13, border: `1.5px dashed ${PAPER}`, boxShadow: "2px 2px 0 rgba(23,20,16,0.25)",
    }}>₹{value}</div>
  );
}

function ProductCard({ p, onAdd, added, rating }) {
  const hasRating = rating && rating.count > 0;
  const hasSizes = p.sizes && p.sizes.length > 0;
  const [selectedSize, setSelectedSize] = useState(hasSizes ? null : undefined);
  const [sizeError, setSizeError] = useState(false);

  function handleAdd() {
    if (hasSizes && !selectedSize) {
      setSizeError(true);
      setTimeout(() => setSizeError(false), 1200);
      return;
    }
    onAdd(p, selectedSize);
  }

  return (
    <div className="flex flex-col shrink-0" style={{ width: 152, background: "#fff", border: `1px solid ${LINE}` }}>
      <div className="relative flex items-center justify-center overflow-hidden" style={{ height: 130, background: GRADIENTS[p.cat] }}>
        {p.img ? (
          <img src={p.img} alt={p.name} className="w-full h-full object-cover" />
        ) : (
          <span style={{ fontSize: 40, opacity: 0.9 }}>{CATEGORIES.find((c) => c.id === p.cat)?.emoji}</span>
        )}
        {p.trending && (
          <div className="absolute top-1.5 left-1.5 flex items-center gap-0.5" style={{
            background: INK, color: ORANGE, fontFamily: "'Space Mono', monospace", fontSize: 10, fontWeight: 700, padding: "2px 5px",
          }}>🔥 HOT</div>
        )}
        <div className="absolute -bottom-2 left-2"><PriceTag value={p.price} /></div>
      </div>
      <div className="px-2 pt-3 pb-2 flex flex-col gap-1.5" style={{ color: INK }}>
        <p className="leading-tight" style={{ fontFamily: "'Work Sans', sans-serif", fontWeight: 600, fontSize: 12.5, minHeight: 32 }}>{p.name}</p>
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, fontWeight: 700 }}>● {p.sold} sold today</span>
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10.5, color: hasRating ? INK : "#999", fontWeight: 700 }}>
          {hasRating ? `⭐ ${rating.avg.toFixed(1)} (${rating.count})` : "☆ No ratings yet"}
        </span>
        {hasSizes && (
          <div className="flex flex-col gap-1">
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 9.5, color: sizeError ? "#c0392b" : INK, opacity: sizeError ? 1 : 0.65, fontWeight: 700 }}>
              {sizeError ? "Select a size first" : "SIZE"}
            </span>
            <div className="flex flex-wrap gap-1">
              {p.sizes.map((s) => (
                <button key={s} onClick={() => setSelectedSize(s)} style={{
                  width: 24, height: 24, fontFamily: "'Space Mono', monospace", fontSize: 10.5, fontWeight: 700,
                  border: `1.5px solid ${selectedSize === s ? INK : LINE}`,
                  background: selectedSize === s ? INK : "transparent",
                  color: selectedSize === s ? PAPER : INK,
                }}>{s}</button>
              ))}
            </div>
          </div>
        )}
        <button onClick={handleAdd} className="mt-1 w-full flex items-center justify-center gap-1 transition-transform active:scale-95" style={{
          background: added ? GREEN : INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, padding: "7px 0",
        }}>{added ? "✓ ADDED" : "+ ADD"}</button>
      </div>
    </div>
  );
}

const WHATSAPP_NUMBER = "919834976390";
const COUNTER_NAMESPACE = "instant-hinganghat-app";
const DELIVERY_FEE = 40;

function InstantApp() {
  const [category, setCategory] = useState("all");
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [justAdded, setJustAdded] = useState(null);
  const [tab, setTab] = useState("home");
  const [custName, setCustName] = useState("");
  const [custPhone, setCustPhone] = useState("");
  const [custAddress, setCustAddress] = useState("");
  const [formError, setFormError] = useState("");

  const [loggedIn, setLoggedIn] = useState(false);
  const [authChecked, setAuthChecked] = useState(false);
  const [loginStep, setLoginStep] = useState("details");
  const [loginName, setLoginName] = useState("");
  const [loginPhone, setLoginPhone] = useState("");
  const [loginError, setLoginError] = useState("");
  const [captchaCode, setCaptchaCode] = useState("");
  const [captchaInput, setCaptchaInput] = useState("");

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("instant_user") || "null");
      if (saved && saved.name && saved.phone) {
        setLoggedIn(true);
        setCustName(saved.name);
        setCustPhone(saved.phone);
      }
    } catch (e) {}
    setAuthChecked(true);
  }, []);

  function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
    setCaptchaCode(code);
  }

  function goToCaptcha() {
    if (!loginName.trim() || loginPhone.trim().length < 10) {
      setLoginError("Poora naam aur 10-digit phone number daalo.");
      return;
    }
    setLoginError("");
    setCaptchaInput("");
    generateCaptcha();
    setLoginStep("captcha");
  }

  function verifyCaptcha() {
    if (captchaInput.trim().toUpperCase() !== captchaCode) {
      setLoginError("Captcha match nahi hua, dubara try karo.");
      generateCaptcha();
      setCaptchaInput("");
      return;
    }
    const user = { name: loginName.trim(), phone: loginPhone.trim() };
    try { localStorage.setItem("instant_user", JSON.stringify(user)); } catch (e) {}
    setCustName(user.name);
    setCustPhone(user.phone);
    setLoggedIn(true);
  }

  const [orderCount, setOrderCount] = useState(0);
  const [orderPlaced, setOrderPlaced] = useState(false);  const [orderId, setOrderId] = useState(null);
  const [orderItems, setOrderItems] = useState([]);
  const [itemRatings, setItemRatings] = useState({});
  const [ratingsMap, setRatingsMap] = useState({});
  const [ratingsSubmitted, setRatingsSubmitted] = useState(false);
  const [feedbackText, setFeedbackText] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [myOrders, setMyOrders] = useState([]);

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("instant_orders") || "[]");
      setMyOrders(saved);
    } catch (e) {}
  }, []);

  function logout() {
    try { localStorage.removeItem("instant_user"); } catch (e) {}
    setLoggedIn(false);
    setLoginStep("details");
    setLoginName(""); setLoginPhone(""); setCaptchaInput(""); setCaptchaCode("");
    setCustName(""); setCustPhone("");
    setTab("home");
  }

  const searchResults = useMemo(() => {
    const q = searchQuery.trim().toLowerCase().replace(/^#/, "");
    if (!q) return [];
    return PRODUCTS.filter((p) => {
      const catLabel = (CATEGORIES.find((c) => c.id === p.cat)?.label || "").toLowerCase();
      return p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q) || catLabel.includes(q);
    });
  }, [searchQuery]);

  useEffect(() => {
    fetch(`https://api.countapi.xyz/get/${COUNTER_NAMESPACE}/orders`)
      .then((r) => r.json())
      .then((d) => setOrderCount(d.value || 0))
      .catch(() => {});

    Promise.all(
      PRODUCTS.map((p) =>
        Promise.all([
          fetch(`https://api.countapi.xyz/get/${COUNTER_NAMESPACE}/p${p.id}_sum`).then((r) => r.json()).catch(() => ({ value: 0 })),
          fetch(`https://api.countapi.xyz/get/${COUNTER_NAMESPACE}/p${p.id}_count`).then((r) => r.json()).catch(() => ({ value: 0 })),
        ]).then(([sumRes, countRes]) => ({ id: p.id, sum: sumRes.value || 0, count: countRes.value || 0 }))
      )
    ).then((results) => {
      const map = {};
      results.forEach((r) => {
        map[r.id] = { avg: r.count > 0 ? r.sum / r.count : 0, count: r.count, sum: r.sum };
      });
      setRatingsMap(map);
    }).catch(() => {});
  }, []);

  const filtered = useMemo(() => (category === "all" ? PRODUCTS : PRODUCTS.filter((p) => p.cat === category)), [category]);
  const trending = PRODUCTS.filter((p) => p.trending);
  const under499 = PRODUCTS.filter((p) => p.price < 499);

  function addToCart(p, size) {
    setCart((c) => [...c, { ...p, selectedSize: size }]);
    setJustAdded(p.id);
    setTimeout(() => setJustAdded(null), 900);
  }

  const total = cart.reduce((s, p) => s + p.price, 0);
  const grandTotal = cart.length > 0 ? total + DELIVERY_FEE : 0;

  function confirmOrder() {
    if (!custName.trim() || !custPhone.trim() || !custAddress.trim()) {
      setFormError("Naam, phone number aur address bharna zaroori hai.");
      return;
    }
    setFormError("");
    const lines = cart.map((p) => `- ${p.name}${p.selectedSize ? " (Size: " + p.selectedSize + ")" : ""} (₹${p.price})`).join("%0A");
    const msg = `Hi INSTANT! New order from Hinganghat%0A%0A${lines}%0A%0AItems Total: ₹${total}%0ADelivery Fee: ₹${DELIVERY_FEE}%0AGrand Total: ₹${grandTotal}%0APayment: Cash on Delivery%0A%0AName: ${custName}%0APhone: ${custPhone}%0AAddress: ${custAddress}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");

    fetch(`https://api.countapi.xyz/hit/${COUNTER_NAMESPACE}/orders`)
      .then((r) => r.json())
      .then((d) => {
        const id = d.value || orderCount + 1;
        setOrderCount(id);
        setOrderId(id);
        saveOrderToHistory(id, cart, grandTotal);
      })
      .catch(() => {
        const id = orderCount + 1;
        setOrderId(id);
        saveOrderToHistory(id, cart, grandTotal);
      });

    setOrderItems(cart);
    setOrderPlaced(true);
    setCart([]);
  }

  function saveOrderToHistory(id, items, orderTotal) {
    const record = {
      id, items: items.map((p) => ({ name: p.name, price: p.price, size: p.selectedSize })),
      total: orderTotal, date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }),
      address: custAddress,
    };
    setMyOrders((prev) => {
      const next = [record, ...prev];
      try { localStorage.setItem("instant_orders", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }

  function rateProduct(id, stars) {
    setItemRatings((r) => ({ ...r, [id]: stars }));
  }

  function submitRatings() {
    const rated = Object.entries(itemRatings).filter(([, v]) => v > 0);
    if (rated.length === 0) return;

    rated.forEach(([id, stars]) => {
      fetch(`https://api.countapi.xyz/update/${COUNTER_NAMESPACE}/p${id}_sum?amount=${stars}`).catch(() => {});
      fetch(`https://api.countapi.xyz/update/${COUNTER_NAMESPACE}/p${id}_count?amount=1`).catch(() => {});
    });

    setRatingsMap((prev) => {
      const next = { ...prev };
      rated.forEach(([id, stars]) => {
        const existing = next[id] || { sum: 0, count: 0 };
        const sum = existing.sum + stars;
        const count = existing.count + 1;
        next[id] = { sum, count, avg: sum / count };
      });
      return next;
    });

    const lines = rated.map(([id, stars]) => {
      const prod = PRODUCTS.find((p) => String(p.id) === String(id));
      return `${prod ? prod.name : "Item"}: ${"⭐".repeat(stars)} (${stars}/5)`;
    }).join("%0A");
    const msg = `Product ratings for order ${orderId ? "#IN-" + orderId : ""} (${custName}):%0A${lines}${feedbackText ? "%0A%0AComment: " + feedbackText : ""}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
    setRatingsSubmitted(true);
  }

  function closeCart() {
    setCartOpen(false);
    setOrderPlaced(false);
    setCustAddress("");
    setItemRatings({}); setFeedbackText(""); setRatingsSubmitted(false); setOrderItems([]);
  }

  if (!authChecked) {
    return <div style={{ minHeight: "100vh", background: "#DAD4C2" }}></div>;
  }

  if (!loggedIn) {
    return (
      <div className="app-bg w-full flex items-center justify-center" style={{ background: "#DAD4C2", fontFamily: "'Work Sans', sans-serif" }}>
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');`}</style>
        <div className="phone-frame relative flex flex-col items-center justify-center px-6" style={{
          background: PAPER, border: `10px solid ${INK}`, borderRadius: 34, boxShadow: "0 20px 50px rgba(0,0,0,0.35)",
        }}>
          <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 30, color: INK, letterSpacing: -0.5 }}>INSTANT</span>
          <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: ORANGE, fontWeight: 700, marginBottom: 28 }}>MEN'S FASHION, INSTANTLY.</span>

          {loginStep === "details" ? (
            <div className="w-full flex flex-col gap-2.5">
              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, fontWeight: 700 }}>WELCOME — LET'S GET STARTED</span>
              <input
                value={loginName}
                onChange={(e) => setLoginName(e.target.value)}
                placeholder="Your Full Name"
                className="w-full px-3 py-2.5"
                style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 14, background: "#fff", color: INK }}
              />
              <input
                value={loginPhone}
                onChange={(e) => setLoginPhone(e.target.value)}
                placeholder="Contact Number"
                type="tel"
                className="w-full px-3 py-2.5"
                style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 14, background: "#fff", color: INK }}
              />
              {loginError && <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: ORANGE }}>{loginError}</p>}
              <button onClick={goToCaptcha} className="w-full py-3 mt-2" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
                CONTINUE
              </button>
            </div>
          ) : (
            <div className="w-full flex flex-col gap-2.5">
              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, fontWeight: 700 }}>VERIFY YOU'RE HUMAN</span>
              <div className="flex items-center justify-between px-3 py-3" style={{ background: INK, border: `1px dashed ${LINE}` }}>
                <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 22, fontWeight: 700, letterSpacing: 6 }}>
                  {captchaCode.split("").map((ch, i) => (
                    <span key={i} style={{
                      display: "inline-block", color: i % 2 === 0 ? ORANGE : PAPER,
                      transform: `rotate(${(i % 2 === 0 ? -1 : 1) * (6 + i * 2)}deg)`,
                    }}>{ch}</span>
                  ))}
                </span>
                <button onClick={generateCaptcha} style={{ fontSize: 16, color: PAPER }}>↻</button>
              </div>
              <input
                value={captchaInput}
                onChange={(e) => setCaptchaInput(e.target.value)}
                placeholder="Enter the code above"
                className="w-full px-3 py-2.5"
                style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Space Mono', monospace", fontSize: 15, letterSpacing: 3, textAlign: "center", background: "#fff", color: INK, textTransform: "uppercase" }}
              />
              {loginError && <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: ORANGE }}>{loginError}</p>}
              <button onClick={verifyCaptcha} className="w-full py-3 mt-1" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
                VERIFY &amp; CONTINUE
              </button>
              <button onClick={() => { setLoginStep("details"); setCaptchaInput("");
              ← Change number
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="app-bg w-full flex items-center justify-center" style={{ background: "#DAD4C2", fontFamily: "'Work Sans', sans-serif" }}>
      <div className="phone-frame relative overflow-hidden flex flex-col" style={{
        background: PAPER, border: `10px solid ${INK}`, borderRadius: 34, boxShadow: "0 20px 50px rgba(0,0,0,0.35)",
      }}>
        <div className="overflow-hidden shrink-0 flex items-center" style={{ height: 26, background: INK }}>
          <div className="ticker-track flex items-center gap-8 whitespace-nowrap">
            {[0, 1].map((i) => (
              <span key={i} style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: GREEN }} className="flex items-center gap-8">
                <span>🔥 LIVE IN HINGANGHAT</span>
                <span style={{ color: ORANGE }}>● {orderCount} ORDERS PLACED TILL DATE</span>
                <span style={{ color: PAPER }}>OVERSIZED TEE ₹399</span>
                <span style={{ color: PAPER }}>BAGGY CARGO ₹699</span>
                <span style={{ color: ORANGE }}>● CASH ON DELIVERY AVAILABLE</span>
              </span>
            ))}
          </div>
        </div>

        <div className="shrink-0 flex items-center justify-between px-4 pt-3 pb-2" style={{ borderBottom: `1px solid ${LINE}` }}>
          <div className="flex flex-col leading-none">
            <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 22, color: INK, letterSpacing: -0.5 }}>INSTANT</span>
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 9, color: ORANGE, fontWeight: 700 }}>MEN'S FASHION, INSTANTLY.</span>
          </div>
          <div className="flex items-center gap-3">
            <div className="flex items-center gap-1 px-2 py-1" style={{ border: `1px dashed ${LINE}`, fontFamily: "'Space Mono', monospace", fontSize: 10 }}>📍 HINGANGHAT</div>
            <button onClick={() => setCartOpen(true)} className="relative" style={{ fontSize: 20 }}>
              🛍
              {cart.length > 0 && (
                <span className="absolute -top-1.5 -right-1.5 flex items-center justify-center" style={{
                  background: ORANGE, color: PAPER, width: 15, height: 15, borderRadius: "50%", fontSize: 9, fontWeight: 700, fontFamily: "'Space Mono', monospace",
                }}>{cart.length}</span>
              )}
            </button>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto pb-2">
          {tab === "home" && (
            <>
              <div className="flex gap-2 px-4 pt-3 pb-1 overflow-x-auto">
                {CATEGORIES.map((c) => (
                  <button key={c.id} onClick={() => setCategory(c.id)} className="shrink-0 flex items-center gap-1 px-3 py-1.5 transition-colors" style={{
                    background: category === c.id ? NAVY : "transparent", color: category === c.id ? PAPER : INK,
                    border: `1.5px solid ${category === c.id ? NAVY : LINE}`, fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700,
                  }}><span>{c.emoji}</span> {c.label}</button>
                ))}
              </div>

              <div className="mt-4">
                <div className="flex items-center gap-1.5 px-4 mb-2">
                  <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: INK }}>🔥 Today's Trending Fits</span>
                </div>
                <div className="flex gap-3 px-4 overflow-x-auto pb-2">
                  {trending.map((p) => <ProductCard key={p.id} p={p} onAdd={addToCart} added={justAdded === p.id} rating={ratingsMap[p.id]} />)}
                </div>
              </div>

              <div className="mt-5">
                <div className="flex items-center justify-between px-4 mb-2">
                  <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: INK }}>Under ₹499</span>
                  <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, fontWeight: 700 }}>COLLEGE PICKS</span>
                </div>
                <div className="flex gap-3 px-4 overflow-x-auto pb-2">
                  {under499.map((p) => <ProductCard key={p.id} p={p} onAdd={addToCart} added={justAdded === p.id} rating={ratingsMap[p.id]} />)}
                </div>
              </div>

              <div className="mt-5 px-4">
                <div className="flex items-center gap-2 mb-2 pb-1" style={{ borderBottom: `1px dashed ${LINE}` }}>
                  <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: INK }}>
                    {category === "all" ? "All Products" : CATEGORIES.find((c) => c.id === category)?.label}
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {filtered.map((p) => <ProductCard key={p.id} p={p} onAdd={addToCart} added={justAdded === p.id} rating={ratingsMap[p.id]} />)}
                </div>
              </div>
            </>
          )}

          {tab === "search" && (
            <div className="px-4 pt-3">
              <input
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search — try 'shirt', 'tee', 'shoes'..."
                className="w-full px-3 py-2.5 mb-3"
                style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK }}
              />
              {searchQuery.trim() === "" ? (
                <p className="text-center py-10" style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.5 }}>
                  Type to search products
                </p>
              ) : searchResults.length === 0 ? (
                <p className="text-center py-10" style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.5 }}>
                  No products found for "{searchQuery}"
                </p>
              ) : (
                <div className="grid grid-cols-2 gap-3 pb-2">
                  {searchResults.map((p) => <ProductCard key={p.id} p={p} onAdd={addToCart} added={justAdded === p.id} rating={ratingsMap[p.id]} />)}
                </div>
              )}
            </div>
          )}

          {tab === "orders" && (
            <div className="px-4 pt-3 pb-2">
              <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 15, color: INK }}>Your Orders</span>
              {myOrders.length === 0 ? (
                <p className="text-center py-10" style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.5 }}>
                  No orders yet — go place one!
                </p>
              ) : (
                <div className="flex flex-col gap-2 mt-2">
                  {myOrders.map((o, i) => (
                    <div key={i} className="px-3 py-2.5" style={{ background: "#fff", border: `1px solid ${LINE}` }}>
                      <div className="flex items-center justify-between">
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11.5, color: INK, fontWeight: 700 }}>#IN-{o.id}</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.6 }}>{o.date}</span>
                      </div>
                      <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11.5, color: INK, opacity: 0.8, marginTop: 3 }}>
                        {o.items.map((it) => it.name).join(", ")}
                      </p>
                      <div className="flex items-center justify-between mt-1.5">
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, fontWeight: 700 }}>● Placed · COD</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: ORANGE, fontWeight: 700 }}>₹{o.total}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === "profile" && (
            <div className="px-4 pt-4 pb-2 flex flex-col items-center">
              <div className="flex items-center justify-center" style={{ width: 60, height: 60, borderRadius: "50%", background: NAVY, color: PAPER, fontFamily: "'Archivo Black', sans-serif", fontSize: 22 }}>
                {custName ? custName.trim()[0].toUpperCase() : "?"}
              </div>
              <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 17, color: INK, marginTop: 8 }}>{custName || "—"}</span>
              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11.5, color: INK, opacity: 0.7 }}>{custPhone}</span>
              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, fontWeight: 700, marginTop: 4 }}>📍 HINGANGHAT</span>

              <div className="w-full mt-6 flex flex-col gap-2">
                <button onClick={() => setTab("orders")} className="w-full flex items-center justify-between px-3 py-3" style={{ background: "#fff", border: `1px solid ${LINE}` }}>
                  <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, fontWeight: 600 }}>📦 Your Orders</span>
                  <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.5 }}>{myOrders.length} →</span>
                </button>
                <button onClick={logout} className="w-full py-3" style={{ border: `1.5px solid ${ORANGE}`, background: "transparent", color: ORANGE, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 12 }}>
                  LOG OUT
                </button>
              </div>
            </div>
          )}
        </div>

        <div className="shrink-0 flex items-center justify-around py-2.5" style={{ borderTop: `1.5px solid ${INK}`, background: PAPER }}>
          {[
            { id: "home", icon: "🏠", label: "Home" },
            { id: "search", icon: "🔍", label: "Search" },
            { id: "orders", icon: "📦", label: "Orders" },
            { id: "profile", icon: "👤", label: "Profile" },
          ].map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex flex-col items-center gap-0.5" style={{ color: tab === t.id ? ORANGE : INK }}>
              <span style={{ fontSize: 18 }}>{t.icon}</span>
              <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 9 }}>{t.label}</span>
            </button>
          ))}
        </div>

        {cartOpen && (
          <div className="absolute inset-0 flex flex-col justify-end" style={{ background: "rgba(23,20,16,0.5)" }}>
            <div className="flex flex-col" style={{ background: PAPER, borderTop: `2px solid ${INK}`, maxHeight: "78%", borderRadius: "18px 18px 0 0" }}>
              <div className="flex items-center justify-between px-4 py-3" style={{ borderBottom: `1px dashed ${LINE}` }}>
                <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 16, color: INK }}>
                  {orderPlaced ? "ORDER CONFIRMED" : "YOUR BAG"}
                </span>
                <button onClick={closeCart} style={{ fontSize: 18, color: INK }}>✕</button>
              </div>

              {orderPlaced ? (
                <div className="flex-1 overflow-y-auto px-4 py-4">
                  <div className="flex flex-col items-center text-center gap-1 mb-4">
                    <span style={{ fontSize: 40 }}>✅</span>
                    <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 17, color: INK }}>Thank you{custName ? ", " + custName.split(" ")[0] : ""}!</span>
                    <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: GREEN, fontWeight: 700 }}>
                      Order {orderId ? "#IN-" + orderId : ""} sent via WhatsApp
                    </span>
                    <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK, opacity: 0.75, marginTop: 4 }}>
                      We'll confirm on WhatsApp and deliver to your address. Pay cash when it arrives.
                    </span>
                  </div>

                  <div style={{ borderTop: `1px dashed ${LINE}`, paddingTop: 14 }}>
                    {ratingsSubmitted ? (
                      <p className="text-center" style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: GREEN, fontWeight: 700 }}>
                        🙏 Ratings submitted, thank you!
                      </p>
                    ) : (
                      <>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.6, fontWeight: 700 }}>
                          RATE EACH ITEM (VISIBLE TO OTHER SHOPPERS)
                        </span>
                        <div className="flex flex-col gap-2 mt-2">
                          {orderItems.map((p, i) => (
                            <div key={i} className="flex items-center justify-between px-2 py-1.5" style={{ background: "#fff", border: `1px solid ${LINE}` }}>
                              <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK, fontWeight: 600 }}>{p.name}</span>
                              <div className="flex gap-0.5">
                                {[1, 2, 3, 4, 5].map((n) => (
                                  <button key={n} onClick={() => rateProduct(p.id, n)} style={{ fontSize: 16, opacity: n <= (itemRatings[p.id] || 0) ? 1 : 0.25 }}>⭐</button>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                        <textarea
                          value={feedbackText}
                          onChange={(e) => setFeedbackText(e.target.value)}
                          placeholder="Anything else? (optional)"
                          rows="2"
                          className="w-full px-2 py-2 mt-2"
                          style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 12.5, background: "#fff", color: INK, resize: "none" }}
                        />
                        <button
                          onClick={submitRatings}
                          disabled={Object.values(itemRatings).every((v) => !v)}
                          className="w-full mt-2 py-2.5"
                          style={{
                            background: Object.values(itemRatings).every((v) => !v) ? LINE : INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 12,
                          }}
                        >
                          SUBMIT RATINGS
                        </button>
                      </>
                    )}
                  </div>

                  <button onClick={closeCart} className="w-full mt-4 py-2.5" style={{ border: `1.5px solid ${LINE}`, background: "transparent", color: INK, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 12 }}>
                    CONTINUE SHOPPING
                  </button>
                </div>
              ) : (
                <>
                  <div className="flex-1 overflow-y-auto px-4 py-2">
                    {cart.length === 0 ? (
                      <p className="py-8 text-center" style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.6 }}>Bag is empty. Add something trending.</p>
                    ) : (
                      cart.map((p, i) => (
                        <div key={i} className="flex items-center justify-between py-2" style={{ borderBottom: `1px dashed ${LINE}` }}>
                          <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, fontWeight: 600 }}>{p.name}{p.selectedSize ? ` (Size ${p.selectedSize})` : ""}</span>
                          <PriceTag value={p.price} />
                        </div>
                      ))
                    )}
                  </div>
                  {cart.length > 0 && (
                    <div className="px-4 py-3 overflow-y-auto" style={{ borderTop: `1px solid ${LINE}` }}>
                      <div className="flex items-center justify-between">
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.7 }}>Items Total</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK }}>₹{total}</span>
                      </div>
                      <div className="flex items-center justify-between mt-1 pb-2" style={{ borderBottom: `1px dashed ${LINE}` }}>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.7 }}>Delivery Fee</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK }}>₹{DELIVERY_FEE}</span>
                      </div>
                      <div className="flex items-center justify-between mb-2 mt-1.5">
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, fontWeight: 700, color: INK }}>TOTAL</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 16, fontWeight: 700, color: ORANGE }}>₹{grandTotal}</span>
                      </div>

                      <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.6, fontWeight: 700 }}>DELIVERY DETAILS</span>
                      <input
                        value={custName}
                        onChange={(e) => setCustName(e.target.value)}
                        placeholder="Full Name"
                        className="w-full mt-1.5 px-2 py-2"
                        style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK }}
                      />
                      <input
                        value={custPhone}
                        onChange={(e) => setCustPhone(e.target.value)}
                        placeholder="Contact Number"
                        type="tel"
                        className="w-full mt-2 px-2 py-2"
                        style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK }}
                      />
                      <textarea
                        value={custAddress}
                        onChange={(e) => setCustAddress(e.target.value)}
                        placeholder="Full Delivery Address (Hinganghat)"
                        rows="2"
                        className="w-full mt-2 px-2 py-2"
                        style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 13, background: "#fff", color: INK, resize: "none" }}
                      />
                      {formError && (
                        <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 10.5, color: ORANGE, marginTop: 6 }}>{formError}</p>
                      )}

                      <div className="flex items-center gap-1.5 mt-3 mb-3 px-2 py-2" style={{ background: "#fff", border: `1px dashed ${LINE}` }}>
                        <span style={{ fontSize: 15 }}>💵</span>
                        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, fontWeight: 700 }}>Payment: Cash on Delivery</span>
                      </div>

                      <button onClick={confirmOrder} className="w-full py-3" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
                        CONFIRM ORDER VIA WHATSAPP
                      </button>
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<InstantApp />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
