<html lang="en">

<title>INSTANT — Admin</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDQfP7k5u5R-d6_rEQqNqU0RU_V6CK8xRE",
    authDomain: "instant-41fd1.firebaseapp.com",
    projectId: "instant-41fd1",
    storageBucket: "instant-41fd1.firebasestorage.app",
    messagingSenderId: "257137936905",
    appId: "1:257137936905:web:9c9589d1076cf1ab08c6d8",
  };
  firebase.initializeApp(firebaseConfig);
  window.db = firebase.firestore();
  window.auth = firebase.auth();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Work Sans', sans-serif; background: #DAD4C2; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const INK = "#171410";
const PAPER = "#EDE9DD";
const ORANGE = "#F5B301";
const GREEN = "#1C8A4B";
const NAVY = "#24306B";
const LINE = "#C9C2AE";
const RED = "#c0392b";

const CATEGORIES = [
  { id: "tshirts", label: "T-Shirts" },
  { id: "jeans", label: "Jeans/Pants" },
  { id: "shirts", label: "Shirts" },
  { id: "shorts", label: "Shorts/Cargos" },
  { id: "footwear", label: "Footwear" },
  { id: "accessories", label: "Accessories" },
];

function compressImage(file, maxDim = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function LoginGate({ onSuccess }) {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  function submit(e) {
    e.preventDefault();
    setError("");
    setLoading(true);
    window.auth.signInWithEmailAndPassword(email.trim(), pass)
      .then(() => onSuccess())
      .catch(() => setError("Email ya password galat hai."))
      .finally(() => setLoading(false));
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-6" style={{ background: "#DAD4C2" }}>
      <form onSubmit={submit} className="w-full flex flex-col gap-3" style={{ maxWidth: 340, background: PAPER, border: `2px solid ${INK}`, padding: 24 }}>
        <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 20, color: INK }}>🔒 INSTANT ADMIN</span>
        <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, opacity: 0.75 }}>Login karo apne admin account se.</span>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email"
          className="w-full px-3 py-2.5" style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Work Sans', sans-serif", fontSize: 14, background: "#fff", color: INK }} autoFocus />
        <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Password"
          className="w-full px-3 py-2.5" style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Space Mono', monospace", fontSize: 14, background: "#fff", color: INK }} />
        {error && <span style={{ color: RED, fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700 }}>{error}</span>}
        <button type="submit" disabled={loading} className="w-full py-2.5" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
          {loading ? "..." : "LOGIN"}
        </button>
      </form>
    </div>
  );
}

function ProductForm({ editing, onSave, onCancel }) {
  const [name, setName] = useState(editing ? editing.name : "");
  const [category, setCategory] = useState(editing ? editing.cat : "footwear");
  const [price, setPrice] = useState(editing ? String(editing.price) : "");
  const [mrp, setMrp] = useState(editing && editing.mrp ? String(editing.mrp) : "");
  const [sizesText, setSizesText] = useState(editing && editing.sizes ? editing.sizes.join(", ") : "");
  const [images, setImages] = useState(editing ? (editing.images && editing.images.length ? editing.images : (editing.img ? [editing.img] : [])) : []);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);

  async function handleFiles(fileList) {
    setUploading(true);
    const files = Array.from(fileList).slice(0, 3 - images.length);
    try {
      const compressed = await Promise.all(files.map((f) => compressImage(f)));
      setImages((prev) => [...prev, ...compressed].slice(0, 3));
    } catch (e) {
      alert("Photo load karne mein problem hui, dobara try karo.");
    }
    setUploading(false);
  }

  function removeImage(i) {
    setImages((prev) => prev.filter((_, idx) => idx !== i));
  }

  function submit() {
    if (!name.trim()) { alert("Product ka naam daalo."); return; }
    if (!price || isNaN(Number(price))) { alert("Sahi price daalo."); return; }
    if (images.length === 0) { alert("Kam se kam ek photo upload karo."); return; }

    const sizes = sizesText.split(",").map((s) => s.trim()).filter(Boolean);
    const sizesIsNumeric = sizes.length > 0 && sizes.every((s) => !isNaN(Number(s)));
    const sizesArr = sizes.length > 0 ? sizes.map((s) => (sizesIsNumeric ? Number(s) : s)) : null;

    const obj = {
      name: name.trim(),
      cat: category,
      price: Number(price),
      sold: editing ? editing.sold || 0 : 0,
      img: images[0],
      images: images,
      mrp: (mrp && !isNaN(Number(mrp)) && Number(mrp) > Number(price)) ? Number(mrp) : null,
      sizes: sizesArr,
      outOfStock: editing ? !!editing.outOfStock : false,
    };

    setSaving(true);
    onSave(editing ? editing.id : null, obj).finally(() => setSaving(false));
  }

  return (
    <div className="flex flex-col gap-3 p-4" style={{ background: PAPER, border: `1.5px solid ${INK}` }}>
      <div className="flex items-center justify-between">
        <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 16, color: INK }}>{editing ? "EDIT PRODUCT" : "+ ADD PRODUCT"}</span>
        <button onClick={onCancel} style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.6 }}>✕ Cancel</button>
      </div>

      <div className="flex flex-col gap-1">
        <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>PRODUCT NAME</label>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Asian Sneakers"
          className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 14, color: INK }} />
      </div>

      <div className="flex flex-col gap-1">
        <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>CATEGORY</label>
        <select value={category} onChange={(e) => setCategory(e.target.value)}
          className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 14, color: INK }}>
          {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
      </div>

      <div className="flex gap-3">
        <div className="flex flex-col gap-1 flex-1">
          <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>PRICE (₹)</label>
          <input value={price} onChange={(e) => setPrice(e.target.value)} type="number" placeholder="549"
            className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Space Mono', monospace", fontSize: 14, color: INK }} />
        </div>
        <div className="flex flex-col gap-1 flex-1">
          <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>MRP (optional)</label>
          <input value={mrp} onChange={(e) => setMrp(e.target.value)} type="number" placeholder="699"
            className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Space Mono', monospace", fontSize: 14, color: INK }} />
        </div>
      </div>
      {mrp && !isNaN(Number(mrp)) && !isNaN(Number(price)) && Number(mrp) > Number(price) && (
        <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: GREEN, fontWeight: 700 }}>
          {Math.round(((Number(mrp) - Number(price)) / Number(mrp)) * 100)}% OFF dikhega
        </span>
      )}

      <div className="flex flex-col gap-1">
        <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>SIZES (optional, comma se alag karo)</label>
        <input value={sizesText} onChange={(e) => setSizesText(e.target.value)} placeholder="e.g. 7,8,9 or S,M,L,XL"
          className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 14, color: INK }} />
        <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, color: INK, opacity: 0.6 }}>Khaali chhod do agar size zaroori nahi.</span>
      </div>

      <div className="flex flex-col gap-1">
        <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>PHOTOS (max 3, alag angles)</label>
        <input type="file" accept="image/*" multiple onChange={(e) => e.target.files.length && handleFiles(e.target.files)}
          className="px-2 py-2" style={{ border: `1.5px dashed ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK }} />
        {uploading && <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.6 }}>Processing photo...</span>}
        {images.length > 0 && (
          <div className="flex gap-2 flex-wrap mt-1">
            {images.map((im, i) => (
              <div key={i} className="relative" style={{ width: 64, height: 64 }}>
                <img src={im} className="w-full h-full object-cover" style={{ border: `1px solid ${LINE}` }} />
                <button onClick={() => removeImage(i)} className="absolute -top-1.5 -right-1.5 flex items-center justify-center" style={{
                  width: 18, height: 18, borderRadius: "50%", background: RED, color: "#fff", fontSize: 11, lineHeight: 1,
                }}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <button onClick={submit} disabled={saving} className="w-full py-3 mt-1" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
        {saving ? "SAVING..." : (editing ? "✓ SAVE CHANGES" : "+ ADD PRODUCT — GOES LIVE INSTANTLY")}
      </button>
    </div>
  );
}

function ProductRow({ p, onToggleStock, onDelete, onEdit }) {
  return (
    <div className="flex items-center gap-3 p-2.5" style={{ background: "#fff", border: `1px solid ${LINE}` }}>
      <div className="relative shrink-0" style={{ width: 52, height: 52, background: PAPER }}>
        {p.img && <img src={p.img} className="w-full h-full object-cover" />}
        {p.outOfStock && <div className="absolute inset-0" style={{ background: "rgba(23,20,16,0.5)" }} />}
      </div>
      <div className="flex-1 min-w-0 flex flex-col gap-0.5">
        <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12.5, fontWeight: 700, color: INK, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
        <div className="flex items-center gap-1.5 flex-wrap">
          <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>₹{p.price}</span>
          {p.mrp && p.mrp > p.price && <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: "#8a8578", textDecoration: "line-through" }}>₹{p.mrp}</span>}
          <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 9.5, color: NAVY, border: `1px solid ${NAVY}`, padding: "0px 4px" }}>{CATEGORIES.find((c) => c.id === p.cat)?.label || p.cat}</span>
        </div>
      </div>
      <div className="flex flex-col items-end gap-1.5 shrink-0">
        <button onClick={() => onToggleStock(p)} style={{
          fontFamily: "'Space Mono', monospace", fontSize: 9.5, fontWeight: 700, padding: "3px 7px",
          background: p.outOfStock ? "#f4d5d5" : "#d5ecdc", color: p.outOfStock ? RED : GREEN, border: `1px solid ${p.outOfStock ? RED : GREEN}`,
        }}>{p.outOfStock ? "OUT OF STOCK" : "IN STOCK"}</button>
        <div className="flex items-center gap-1.5">
          <button onClick={() => onEdit(p)} style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, textDecoration: "underline" }}>Edit</button>
          <button onClick={() => onDelete(p.id)} style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: RED, textDecoration: "underline" }}>Delete</button>
        </div>
      </div>
    </div>
  );
}

function AdminApp() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("list");
  const [editing, setEditing] = useState(null);

  useEffect(() => {
    const unsub = window.auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthChecked(true);
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) return;
    const unsub = window.db.collection("products").onSnapshot(
      (snap) => {
        setProducts(snap.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
        setLoading(false);
      },
      () => setLoading(false)
    );
    return () => unsub();
  }, [user]);

  function handleSave(id, obj) {
    if (id) {
      return window.db.collection("products").doc(id).update(obj).then(() => {
        setView("list"); setEditing(null);
      });
    }
    return window.db.collection("products").add(obj).then(() => {
      setView("list"); setEditing(null);
    });
  }

  function toggleStock(p) {
    window.db.collection("products").doc(p.id).update({ outOfStock: !p.outOfStock });
  }

  function deleteProduct(id) {
    if (!confirm("Pakka is product ko delete karna hai?")) return;
    window.db.collection("products").doc(id).delete();
  }

  function openEdit(p) { setEditing(p); setView("form"); }
  function openAdd() { setEditing(null); setView("form"); }
  function logout() { window.auth.signOut(); }

  if (!authChecked) return <div className="min-h-screen" style={{ background: "#DAD4C2" }}></div>;
  if (!user) return <LoginGate onSuccess={() => {}} />;

  return (
    <div className="min-h-screen px-4 py-5" style={{ background: "#DAD4C2" }}>
      <div className="mx-auto flex flex-col gap-4" style={{ maxWidth: 480 }}>
        <div className="flex items-center justify-between">
          <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 20, color: INK }}>INSTANT ADMIN</span>
          <div className="flex items-center gap-3">
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.6 }}>{products.length} PRODUCTS</span>
            <button onClick={logout} style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: RED, textDecoration: "underline" }}>Logout</button>
          </div>
        </div>

        {view === "form" ? (
          <ProductForm editing={editing} onSave={handleSave} onCancel={() => { setView("list"); setEditing(null); }} />
        ) : (
          <>
            <button onClick={openAdd} className="w-full py-3" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
              + ADD NEW PRODUCT
            </button>

            {loading ? (
              <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.6, textAlign: "center" }}>Loading products...</p>
            ) : products.length === 0 ? (
              <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: INK, opacity: 0.6, textAlign: "center" }}>Koi product nahi hai abhi. Upar wale button se add karo.</p>
            ) : (
              <div className="flex flex-col gap-2">
                {products.map((p) => (
                  <ProductRow key={p.id} p={p} onToggleStock={toggleStock} onDelete={deleteProduct} onEdit={openEdit} />
                ))}
              </div>
            )}
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: GREEN, textAlign: "center" }}>
              ✓ Sab changes turant live hote hain — koi file upload nahi karni.
            </span>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
