<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>INSTANT — Admin (Add Product)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Work Sans', sans-serif; background: #DAD4C2; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const INK = "#171410";
const PAPER = "#EDE9DD";
const ORANGE = "#F5B301";
const GREEN = "#1C8A4B";
const NAVY = "#24306B";
const LINE = "#C9C2AE";

// CHANGE THIS PASSWORD to whatever you like — just edit the text between the quotes below.
const ADMIN_PASSWORD = "instant2026";

const CATEGORIES = [
  { id: "tshirts", label: "T-Shirts" },
  { id: "jeans", label: "Jeans/Pants" },
  { id: "shirts", label: "Shirts" },
  { id: "shorts", label: "Shorts/Cargos" },
  { id: "footwear", label: "Footwear" },
  { id: "accessories", label: "Accessories" },
];

function compressImage(file, maxDim = 900, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function PasswordGate({ onSuccess }) {
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    if (pass === ADMIN_PASSWORD) { onSuccess(); }
    else { setError("Galat password."); setPass(""); }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-6" style={{ background: "#DAD4C2" }}>
      <form onSubmit={submit} className="w-full flex flex-col gap-3" style={{ maxWidth: 340, background: PAPER, border: `2px solid ${INK}`, padding: 24 }}>
        <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 20, color: INK }}>🔒 INSTANT ADMIN</span>
        <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, opacity: 0.75 }}>Ye page sirf tumhare liye hai. Password daalo.</span>
        <input
          type="password"
          value={pass}
          onChange={(e) => setPass(e.target.value)}
          placeholder="Password"
          className="w-full px-3 py-2.5"
          style={{ border: `1.5px solid ${LINE}`, fontFamily: "'Space Mono', monospace", fontSize: 14, background: "#fff", color: INK }}
          autoFocus
        />
        {error && <span style={{ color: "#c0392b", fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700 }}>{error}</span>}
        <button type="submit" className="w-full py-2.5" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>UNLOCK</button>
      </form>
    </div>
  );
}

function AdminApp() {
  const [unlocked, setUnlocked] = useState(false);
  const [name, setName] = useState("");
  const [category, setCategory] = useState("footwear");
  const [price, setPrice] = useState("");
  const [mrp, setMrp] = useState("");
  const [sizesText, setSizesText] = useState("");
  const [images, setImages] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [code, setCode] = useState("");
  const [copied, setCopied] = useState(false);

  async function handleFiles(fileList) {
    setUploading(true);
    const files = Array.from(fileList).slice(0, 4);
    try {
      const compressed = await Promise.all(files.map((f) => compressImage(f)));
      setImages((prev) => [...prev, ...compressed].slice(0, 4));
    } catch (e) {
      alert("Photo load karne mein problem hui, dobara try karo.");
    }
    setUploading(false);
  }

  function removeImage(i) {
    setImages((prev) => prev.filter((_, idx) => idx !== i));
  }

  function generate() {
    if (!name.trim()) { alert("Product ka naam daalo."); return; }
    if (!price || isNaN(Number(price))) { alert("Sahi price daalo."); return; }
    if (images.length === 0) { alert("Kam se kam ek photo upload karo."); return; }

    const id = Date.now();
    const sizes = sizesText.split(",").map((s) => s.trim()).filter(Boolean);
    const sizesIsNumeric = sizes.length > 0 && sizes.every((s) => !isNaN(Number(s)));
    const sizesArrStr = sizes.length > 0
      ? `[${sizes.map((s) => (sizesIsNumeric ? s : `"${s}"`)).join(", ")}]`
      : null;

    const lines = [];
    lines.push(`  {`);
    lines.push(`    id: ${id},`);
    lines.push(`    name: "${name.trim().replace(/"/g, '\\"')}",`);
    lines.push(`    cat: "${category}",`);
    lines.push(`    price: ${Number(price)},`);
    if (mrp && !isNaN(Number(mrp)) && Number(mrp) > Number(price)) lines.push(`    mrp: ${Number(mrp)},`);
    lines.push(`    sold: 0,`);
    lines.push(`    img: "${images[0]}",`);
    lines.push(`    images: [${images.map((im) => `"${im}"`).join(", ")}],`);
    if (sizesArrStr) lines.push(`    sizes: ${sizesArrStr},`);
    lines.push(`  },`);

    setCode(lines.join("\n"));
    setCopied(false);
  }

  function copyCode() {
    navigator.clipboard.writeText(code).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  }

  function resetForm() {
    setName(""); setPrice(""); setMrp(""); setSizesText(""); setImages([]); setCode(""); setCopied(false);
  }

  if (!unlocked) return <PasswordGate onSuccess={() => setUnlocked(true)} />;

  return (
    <div className="min-h-screen px-4 py-5" style={{ background: "#DAD4C2" }}>
      <div className="mx-auto flex flex-col gap-4" style={{ maxWidth: 480 }}>
        <div className="flex items-center justify-between">
          <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 20, color: INK }}>+ ADD PRODUCT</span>
          <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.6 }}>ADMIN ONLY</span>
        </div>

        <div className="flex flex-col gap-3 p-4" style={{ background: PAPER, border: `1.5px solid ${INK}` }}>
          <div className="flex flex-col gap-1">
            <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>PRODUCT NAME</label>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Asian Sneakers"
              className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 14, color: INK }} />
          </div>

          <div className="flex flex-col gap-1">
            <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>CATEGORY</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)}
              className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 14, color: INK }}>
              {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>

          <div className="flex gap-3">
            <div className="flex flex-col gap-1 flex-1">
              <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>PRICE (₹)</label>
              <input value={price} onChange={(e) => setPrice(e.target.value)} type="number" placeholder="549"
                className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Space Mono', monospace", fontSize: 14, color: INK }} />
            </div>
            <div className="flex flex-col gap-1 flex-1">
              <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>MRP (optional)</label>
              <input value={mrp} onChange={(e) => setMrp(e.target.value)} type="number" placeholder="699"
                className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Space Mono', monospace", fontSize: 14, color: INK }} />
            </div>
          </div>
          {mrp && !isNaN(Number(mrp)) && !isNaN(Number(price)) && Number(mrp) > Number(price) && (
            <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: GREEN, fontWeight: 700 }}>
              {Math.round(((Number(mrp) - Number(price)) / Number(mrp)) * 100)}% OFF dikhega
            </span>
          )}

          <div className="flex flex-col gap-1">
            <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>SIZES (optional, comma se alag karo)</label>
            <input value={sizesText} onChange={(e) => setSizesText(e.target.value)} placeholder="e.g. 7,8,9 or S,M,L,XL"
              className="px-3 py-2" style={{ border: `1.5px solid ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 14, color: INK }} />
            <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, color: INK, opacity: 0.6 }}>Khaali chhod do agar size select karne ki zaroorat nahi (jaise cap, bracelet).</span>
          </div>

          <div className="flex flex-col gap-1">
            <label style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, fontWeight: 700, color: INK }}>PHOTOS (max 4, alag angles)</label>
            <input type="file" accept="image/*" multiple onChange={(e) => e.target.files.length && handleFiles(e.target.files)}
              className="px-2 py-2" style={{ border: `1.5px dashed ${LINE}`, background: "#fff", fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK }} />
            {uploading && <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 11, color: INK, opacity: 0.6 }}>Processing photo...</span>}
            {images.length > 0 && (
              <div className="flex gap-2 flex-wrap mt-1">
                {images.map((im, i) => (
                  <div key={i} className="relative" style={{ width: 64, height: 64 }}>
                    <img src={im} className="w-full h-full object-cover" style={{ border: `1px solid ${LINE}` }} />
                    <button onClick={() => removeImage(i)} className="absolute -top-1.5 -right-1.5 flex items-center justify-center" style={{
                      width: 18, height: 18, borderRadius: "50%", background: "#c0392b", color: "#fff", fontSize: 11, lineHeight: 1,
                    }}>✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <button onClick={generate} className="w-full py-3 mt-1" style={{ background: INK, color: PAPER, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 13 }}>
            ⚡ GENERATE CODE
          </button>
        </div>

        {code && (
          <div className="flex flex-col gap-2 p-4" style={{ background: "#fff", border: `1.5px solid ${GREEN}` }}>
            <span style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 14, color: GREEN }}>✅ Code Ready!</span>
            <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12.5, color: INK, whiteSpace: "pre-line" }}>
              1. Neeche "COPY CODE" pe tap karo{"\n"}
              2. GitHub pe index.html file kholo, edit (pencil) pe tap karo{"\n"}
              3. Jahan "const PRODUCTS = [" likha hai, uske turant neeche is code ko paste karo{"\n"}
              4. Commit changes — naya product live ho jayega
            </span>
            <textarea readOnly value={code} rows="10" className="w-full px-2 py-2" style={{
              border: `1.5px solid ${LINE}`, fontFamily: "'Space Mono', monospace", fontSize: 10.5, color: INK, background: PAPER, resize: "none",
            }} />
            <div className="flex gap-2">
              <button onClick={copyCode} className="flex-1 py-2.5" style={{ background: copied ? GREEN : ORANGE, color: INK, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 12 }}>
                {copied ? "✓ COPIED!" : "COPY CODE"}
              </button>
              <button onClick={resetForm} className="py-2.5 px-4" style={{ border: `1.5px solid ${LINE}`, background: "transparent", color: INK, fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: 12 }}>
                + New Product
              </button>
            </div>
          </div>
        )}

        <p style={{ fontFamily: "'Space Mono', monospace", fontSize: 10, color: INK, opacity: 0.5, textAlign: "center" }}>
          Photos yahi is code ke andar save ho jaati hain (koi alag file upload nahi karni padti).
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
